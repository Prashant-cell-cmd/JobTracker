services:
  - type: web
    name: jobtracker-api
    runtime: node
    plan: free
    branch: main
    numInstances: 1
    buildCommand: npm ci --include=dev
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: EXPO_WEB_ORIGINS
        value: https://prashant-cell-cmd.github.io
